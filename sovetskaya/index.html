<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Дворник: Очисти улицу</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #111; font-family: Arial, sans-serif; color: white;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex; justify-content: center; align-items: center;
        }
        #game-container {
            position: relative;
            width: 1000px; height: 600px;
            transform-origin: center center;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid #444;
        }
        #gameCanvas {
            display: block;
            width: 100%; height: 100%;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-color: #555;
        }
        #ui {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between;
            font-size: 26px; font-weight: bold;
            text-shadow: 2px 2px 4px black, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            pointer-events: none; z-index: 10;
        }
        @keyframes pulse-red {
            0% { color: white; transform: scale(1); }
            50% { color: #ff3333; transform: scale(1.15); }
            100% { color: white; transform: scale(1); }
        }
        .time-warning {
            animation: pulse-red 0.4s infinite;
            display: inline-block;
        }
        #message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); padding: 30px 50px;
            border-radius: 10px; text-align: center;
            display: none; flex-direction: column; align-items: center;
            z-index: 20; border: 2px solid #4CAF50; min-width: 300px;
        }
        #message h1 { margin: 0 0 10px 0; font-size: 28px; }
        button {
            padding: 12px 24px; font-size: 20px; cursor: pointer; margin-top: 20px;
            background: #4CAF50; color: white; border: none;
            border-radius: 5px; font-weight: bold; transition: background 0.2s;
        }
        button:hover { background: #45a049; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1000" height="600"></canvas>

    <div id="ui">
        <div>Уровень: <span id="level">1</span></div>
        <div>Время: <span id="time">18</span>с</div>
        <div>Мусор: <span id="trashCount">0</span></div>
    </div>

    <div id="message">
        <h1 id="msgTitle">Игра</h1>
        <button id="actionBtn" onclick="handleButtonClick()">Играть</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const timeEl = document.getElementById('time');
    const trashCountEl = document.getElementById('trashCount');
    const levelEl = document.getElementById('level');
    const messageEl = document.getElementById('message');
    const msgTitle = document.getElementById('msgTitle');
    const actionBtn = document.getElementById('actionBtn');

    // ===== КОЭФФИЦИЕНТ РАЗМЕРА =====
    // 1.0 — занимает 100% экрана (вписывание)
    // 0.5 — занимает ~50% ширины экрана (по центру, с чёрными полями)
    // 0.4 — ~40%, ещё меньше
    // 0.7 — ~70%, крупнее
    const SIZE_FACTOR = 0.5;

    function fitGame() {
        const container = document.getElementById('game-container');
        // Вписываем по ширине/высоте, затем умножаем на SIZE_FACTOR
        const baseScale = Math.min(window.innerWidth / 1000, window.innerHeight / 600);
        const scale = baseScale * SIZE_FACTOR;
        container.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fitGame);
    window.addEventListener('orientationchange', () => setTimeout(fitGame, 100));

    const testImg = new Image();
    testImg.src = 'bg.jpg';
    testImg.onerror = function() {
        alert('ВНИМАНИЕ: Файл "bg.jpg" не найден рядом с game.html!\n\nСохраните картинку с названием bg.jpg в ту же папку.');
    };

    // ===== ИГРОВЫЕ КОНСТАНТЫ (внутренние координаты 1000×600) =====
    const GROUND_MIN_Y = 400;
    const GROUND_MAX_Y = 590;
    const GROUND_MIN_X = 20;
    const GROUND_MAX_X = 980;

    let player = { x: 100, y: 550, speed: 7.5 };
    let trashes = [];
    let cats = [];
    let keys = {};

    let gameActive = false;
    let isWinState = false;
    let currentLevel = 1;
    let timeLeft = 18;
    let timerInterval;
    let walkCycle = 0;
    let raiseHandsTimer = 0;

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    // ===== КЛАСС МУСОРА =====
    class Trash {
        constructor(isOnCar = false) {
            this.isOnCar = isOnCar;
            this.size = Math.random() * 10 + 20;
            if (isOnCar) {
                this.x = 750 + Math.random() * 120;
                this.y = 415 + Math.random() * 20;
            } else {
                this.x = Math.random() * (GROUND_MAX_X - GROUND_MIN_X) + GROUND_MIN_X;
                this.y = Math.random() * (GROUND_MAX_Y - GROUND_MIN_Y) + GROUND_MIN_Y;
            }
            this.vx = 0; this.vy = 0;
            const types = ['🍌', '🥤', '📄', '🍎', '🥫', '📦'];
            this.type = types[Math.floor(Math.random() * types.length)];
        }
        update() {
            this.vx *= 0.90;
            this.vy *= 0.90;
            this.x += this.vx;
            this.y += this.vy;
            if (!this.isOnCar) {
                if (this.x < GROUND_MIN_X) { this.x = GROUND_MIN_X; this.vx *= -1; }
                if (this.x > GROUND_MAX_X) { this.x = GROUND_MAX_X; this.vx *= -1; }
                if (this.y < GROUND_MIN_Y) { this.y = GROUND_MIN_Y; this.vy *= -1; }
                if (this.y > GROUND_MAX_Y) { this.y = GROUND_MAX_Y; this.vy *= -1; }
            }
        }
        draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(this.x, this.y + this.size/2, this.size/1.5, this.size/3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = `${this.size}px Arial`;
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(this.type, this.x, this.y);
        }
    }

    // ===== КЛАСС КОТА =====
    class Cat {
        constructor(speed, pushPower) {
            this.size = 35;
            this.x = Math.random() * (GROUND_MAX_X - GROUND_MIN_X) + GROUND_MIN_X;
            this.y = Math.random() * (GROUND_MAX_Y - GROUND_MIN_Y) + GROUND_MIN_Y;
            this.speed = speed;
            this.pushPower = pushPower;
            this.vx = (Math.random() - 0.5) * this.speed;
            this.vy = (Math.random() - 0.5) * this.speed;
        }
        update() {
            if (Math.random() < 0.025) {
                this.vx = (Math.random() - 0.5) * this.speed;
                this.vy = (Math.random() - 0.5) * this.speed;
            }
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < GROUND_MIN_X) { this.x = GROUND_MIN_X; this.vx *= -1; }
            if (this.x > GROUND_MAX_X) { this.x = GROUND_MAX_X; this.vx *= -1; }
            if (this.y < GROUND_MIN_Y) { this.y = GROUND_MIN_Y; this.vy *= -1; }
            if (this.y > GROUND_MAX_Y) { this.y = GROUND_MAX_Y; this.vy *= -1; }
            trashes.forEach(trash => {
                if (!trash.isOnCar) {
                    let dist = Math.hypot(this.x - trash.x, this.y - trash.y);
                    if (dist < this.size) {
                        trash.vx += (trash.x - this.x) * this.pushPower;
                        trash.vy += (trash.y - this.y) * this.pushPower;
                    }
                }
            });
        }
        draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(this.x, this.y + 15, 20, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = "35px Arial";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("🐈", this.x, this.y);
        }
    }

    // ===== УРОВЕНЬ =====
    function setupLevel() {
        const levelConfig = {
            time: 18 + ((currentLevel - 1) * 3),
            trashCount: 8 + (currentLevel * 4),
            catCount: Math.min(2 + currentLevel, 7),
            catSpeed: 2.2 + (currentLevel * 0.6),
            pushPower: 0.2 + (currentLevel * 0.05)
        };

        timeLeft = levelConfig.time;
        trashes = []; cats = []; raiseHandsTimer = 0;

        player.x = 100;
        player.y = 550;

        for (let i = 0; i < 2; i++) trashes.push(new Trash(true));
        for (let i = 2; i < levelConfig.trashCount; i++) trashes.push(new Trash(false));
        for (let i = 0; i < levelConfig.catCount; i++) cats.push(new Cat(levelConfig.catSpeed, levelConfig.pushPower));

        levelEl.innerText = currentLevel;
        trashCountEl.innerText = trashes.length;
        timeEl.innerText = Math.ceil(timeLeft);
        timeEl.classList.remove('time-warning');

        gameActive = true;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (gameActive) {
                timeLeft--;
                timeEl.innerText = Math.ceil(timeLeft);
                if (timeLeft <= 4) timeEl.classList.add('time-warning');
                else timeEl.classList.remove('time-warning');
                if (timeLeft <= 0) endGame(false);
            }
        }, 1000);

        requestAnimationFrame(gameLoop);
    }

    function startGame() {
        messageEl.style.display = 'none';
        setupLevel();
    }

    function endGame(isWin) {
        gameActive = false; isWinState = isWin;
        clearInterval(timerInterval);
        messageEl.style.display = 'flex';
        if (isWin) {
            msgTitle.innerText = `🎉 Уровень ${currentLevel} пройден!`;
            msgTitle.style.color = "#4CAF50";
            actionBtn.innerText = "Следующий уровень";
        } else {
            msgTitle.innerText = "💀 Время вышло!";
            msgTitle.style.color = "#f44336";
            actionBtn.innerText = "Начать сначала";
        }
    }

    function handleButtonClick() {
        if (isWinState) currentLevel++;
        else currentLevel = 1;
        startGame();
    }

    // ===== ДВОРНИК =====
    function drawJanitor(x, y) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.beginPath(); ctx.ellipse(x, y + 5, 22, 10, 0, 0, Math.PI * 2); ctx.fill();

        let legOffset = Math.sin(walkCycle) * 5;
        ctx.fillStyle = "#2c3e50";
        ctx.fillRect(x - 12, y - 25, 8, 25 + legOffset);
        ctx.fillRect(x + 4, y - 25, 8, 25 - legOffset);
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(x - 14, y - 2 + legOffset, 12, 6);
        ctx.fillRect(x + 2, y - 2 - legOffset, 12, 6);

        ctx.fillStyle = "#2980b9";
        ctx.fillRect(x - 15, y - 60, 30, 35);
        ctx.fillStyle = "#e67e22";
        ctx.fillRect(x - 15, y - 60, 30, 35);
        ctx.fillStyle = "#f1c40f";
        ctx.fillRect(x - 15, y - 45, 30, 4);
        ctx.fillRect(x - 15, y - 35, 30, 4);

        ctx.fillStyle = "#f1c40f";
        ctx.beginPath(); ctx.arc(x, y - 75, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#c0392b";
        ctx.beginPath(); ctx.arc(x, y - 80, 12, Math.PI, 0); ctx.fill();
        ctx.fillRect(x, y - 80, 16, 4);
        ctx.fillStyle = "#000";
        ctx.beginPath(); ctx.arc(x + 5, y - 76, 1.5, 0, Math.PI * 2); ctx.fill();

        if (raiseHandsTimer > 0) {
            ctx.fillStyle = "#2980b9";
            ctx.fillRect(x - 20, y - 80, 8, 20);
            ctx.fillRect(x + 12, y - 80, 8, 20);
            ctx.save();
            ctx.translate(x + 25, y - 30); ctx.rotate(-Math.PI / 4);
            ctx.strokeStyle = "#8e6b3e"; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 60); ctx.stroke();
            ctx.fillStyle = "#f1c40f";
            ctx.beginPath();
            ctx.moveTo(-15, 60); ctx.lineTo(15, 60); ctx.lineTo(20, 80); ctx.lineTo(-20, 80);
            ctx.fill();
            ctx.restore();
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 30px Arial";
            ctx.textAlign = "center";
            ctx.fillText("!", x, y - 100);
        } else {
            ctx.fillStyle = "#2980b9";
            ctx.fillRect(x + 10, y - 55, 8, 20);
            ctx.save();
            ctx.translate(x + 15, y - 35); ctx.rotate(Math.PI / 6);
            ctx.strokeStyle = "#8e6b3e"; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 60); ctx.stroke();
            ctx.fillStyle = "#f1c40f";
            ctx.beginPath();
            ctx.moveTo(-15, 60); ctx.lineTo(15, 60); ctx.lineTo(20, 80); ctx.lineTo(-20, 80);
            ctx.fill();
            ctx.strokeStyle = "#d35400"; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-10, 65); ctx.lineTo(10, 65);
            ctx.moveTo(-15, 75); ctx.lineTo(15, 75);
            ctx.stroke();
            ctx.restore();
        }
    }

    // ===== ОБНОВЛЕНИЕ =====
    function update() {
        if (!gameActive) return;

        let isMoving = false;
        if (keys['ArrowUp'] || keys['w'] || keys['W']) { player.y -= player.speed; isMoving = true; }
        if (keys['ArrowDown'] || keys['s'] || keys['S']) { player.y += player.speed; isMoving = true; }
        if (keys['ArrowLeft'] || keys['a'] || keys['A']) { player.x -= player.speed; isMoving = true; }
        if (keys['ArrowRight'] || keys['d'] || keys['D']) { player.x += player.speed; isMoving = true; }

        if (isMoving) walkCycle += 0.2; else walkCycle = 0;

        if (player.x < GROUND_MIN_X) player.x = GROUND_MIN_X;
        if (player.x > GROUND_MAX_X) player.x = GROUND_MAX_X;
        if (player.y < GROUND_MIN_Y + 40) player.y = GROUND_MIN_Y + 40;
        if (player.y > GROUND_MAX_Y) player.y = GROUND_MAX_Y;

        for (let i = trashes.length - 1; i >= 0; i--) {
            trashes[i].update();
            let refY = trashes[i].isOnCar ? (player.y - 70) : (player.y - 20);
            let radius = trashes[i].isOnCar ? 100 : 50;
            let dist = Math.hypot(player.x - trashes[i].x, refY - trashes[i].y);
            if (dist < radius) {
                if (trashes[i].isOnCar) raiseHandsTimer = 60;
                trashes.splice(i, 1);
                trashCountEl.innerText = trashes.length;
                if (trashes.length === 0) endGame(true);
            }
        }

        cats.forEach(cat => cat.update());
        if (raiseHandsTimer > 0) raiseHandsTimer--;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        cats.forEach(cat => cat.draw());
        trashes.forEach(trash => trash.draw());
        drawJanitor(player.x, player.y);
    }

    function gameLoop() {
        if (!gameActive) return;
        update(); draw();
        requestAnimationFrame(gameLoop);
    }

    // ===== СТАРТ =====
    window.onload = () => {
        fitGame();
        msgTitle.innerText = "Дворник: Очисти улицу";
        actionBtn.innerText = "Начать игру";
        messageEl.style.display = 'flex';
        drawJanitor(player.x, player.y);
    };
</script>
</body>
</html>
